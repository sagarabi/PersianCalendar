name: Import Persian Calendar upstream

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  import:
    if: github.actor == 'sagarabi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream source
        run: |
          set -euxo pipefail
          rm -rf /tmp/upstream /tmp/upstream.tar.gz
          curl -L --fail --retry 3 -o /tmp/upstream.tar.gz https://github.com/persian-calendar/persian-calendar/archive/refs/heads/master.tar.gz
          mkdir -p /tmp/upstream
          tar -xzf /tmp/upstream.tar.gz -C /tmp/upstream --strip-components=1
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/upstream/. .

      - name: Commit and push imported source
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Persian Calendar upstream project" || true
          git push origin HEAD:main
